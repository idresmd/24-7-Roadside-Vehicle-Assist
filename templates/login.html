{% extends 'base.html' %}
{% block title %}Login - RoadAssist 24/7{% endblock %}
{% block content %}
<section class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
        <div class="card-header modal-header"><h5 class="modal-title"><i class="fa-solid fa-user-tie"></i> Login</h5></div>
        <div class="card-body p-4">
            {{ render_form(form, button_map={'submit': 'primary w-100'}) }}
            <p class="text-center mt-3 mb-0">Don't have an account? <a href="{{ url_for('register', next=request.args.get('next')) }}" class="fw-bold">Register</a></p>
            {% if config.SHOW_DEMO %}<p class="text-muted small mt-3 mb-0 text-center">Demo: admin@roadassist.com / admin123</p>{% endif %}
        </div>
    </div>
</div></div></section>
{% endblock %}
